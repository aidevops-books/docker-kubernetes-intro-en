# k8s/app/config.yaml: Learning example; follow the corresponding chapter before applying.
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-config
data:
  APP_ENV: "production"
  LOG_LEVEL: "info"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: shop-secret
type: Opaque
stringData:
  API_TOKEN: "change-me-in-real-life"
