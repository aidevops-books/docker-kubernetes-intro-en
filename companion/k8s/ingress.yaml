# k8s/ingress.yaml: Learning example; follow the corresponding chapter before applying.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: intro-ingress
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: intro-api
                port:
                  number: 80
          - path: /health
            pathType: Exact
            backend:
              service:
                name: intro-api
                port:
                  number: 80
