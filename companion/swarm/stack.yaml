# swarm/stack.yaml: Learning example; follow the corresponding chapter before applying.
services:
  web:
    image: registry:5000/intro-web:1.0
    ports:
      - "8080:80"
    environment:
      API_UPSTREAM: api:3000
    deploy:
      replicas: 2
  api:
    image: registry:5000/intro-api:1.0
    environment:
      REDIS_HOST: redis
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 5s
        failure_action: rollback
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
volumes:
  redis-data:
