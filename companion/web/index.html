<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Mini CloudShop — Docker & Kubernetes</title>
<style>
  body { font-family: -apple-system, "Segoe UI", sans-serif; max-width: 640px; margin: 80px auto; padding: 0 20px; color: #222; }
  h1 { font-size: 1.5em; }
  button { padding: 10px 18px; font-size: 1em; cursor: pointer; }
  #result { margin-top: 20px; padding: 16px; background: #f4f6f8; border-radius: 6px; white-space: pre-wrap; }
</style>
</head>
<body>
  <h1>Mini CloudShop: Web → API → Redis</h1>
  <p>Send a request through the web server to the API. The API increments a counter in Redis.</p>
  <button onclick="callApi()">Increment the counter</button>
  <div id="result">No request sent yet.</div>
  <script>
    async function callApi() {
      const el = document.getElementById('result');
      el.textContent = 'Sending request...';
      try {
        const res = await fetch('/api/count');
        const data = await res.json();
        el.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        el.textContent = 'Request failed: ' + err;
      }
    }
  </script>
</body>
</html>
